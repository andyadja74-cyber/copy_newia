<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>Reconnexion…</title>
<style>*{margin:0;box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;padding:24px;color:#eaf6ff;font:16px/1.5 -apple-system,system-ui,sans-serif;text-align:center;background:radial-gradient(120% 80% at 50% 0,#0a1830,#02050b 62%)}
.c{width:min(380px,100%);padding:34px 24px;border-radius:30px;background:linear-gradient(150deg,#ffffff1f,#ffffff08);border:1px solid #cfefff2e;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:inset 0 1.5px 0 #ffffff55,0 40px 90px #000a}
.o{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;border:3px solid #9fe3ff22;border-top-color:#9fe3ff;animation:t 1s linear infinite}@keyframes t{to{transform:rotate(360deg)}}
h1{font-size:22px;margin-bottom:6px}p{color:#8aa5bb;font-size:14px}
button{margin-top:20px;padding:14px 26px;border:0;border-radius:18px;font:700 16px inherit;color:#04121f;background:linear-gradient(180deg,#e6f8ff,#8fd8ff 55%,#5aa8ff);box-shadow:inset 0 1.5px 0 #fff,0 12px 30px #3aa9ff55}</style></head>
<body><div class="c"><div class="o"></div><h1>Reconnexion…</h1><p>Pas de connexion pour le moment. Ça repart tout seul dès que le réseau revient.</p><button onclick="location.reload()">Réessayer</button></div>
<script>addEventListener('online',()=>location.reload())</script></body></html>
